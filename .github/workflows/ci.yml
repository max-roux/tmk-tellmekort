name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tmk
          POSTGRES_PASSWORD: tmk
          POSTGRES_DB: tmk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tmk"
          --health-interval 2s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://tmk:tmk@localhost:5432/tmk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app cli.py
      - run: uv run pytest -v
