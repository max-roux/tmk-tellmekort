# Render Blueprint: all resources in Frankfurt (SPEC.md §3, §16).
databases:
  - name: tmk-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: tmk
    user: tmk
    ipAllowList: []

services:
  - type: web
    name: tmk-web
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install uv && uv sync --frozen --no-dev
    preDeployCommand: uv run --no-sync alembic upgrade head
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: DATABASE_URL
        fromDatabase:
          name: tmk-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: NCBI_EMAIL
        sync: false
      - key: POSTMARK_SERVER_TOKEN
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false

  # Hourly: send each user's weekly email once their local slot has passed (SPEC.md §10.1).
  - type: cron
    name: tmk-send
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "5 * * * *"
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync python cli.py send-due
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: DATABASE_URL
        fromDatabase:
          name: tmk-db
          property: connectionString
      # Must equal the web service's key: email buttons are signed with it.
      - key: SECRET_KEY
        fromService:
          type: web
          name: tmk-web
          envVarKey: SECRET_KEY
      - key: BASE_URL
        sync: false
      - key: POSTMARK_SERVER_TOKEN
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false

  # Weekly pipeline: Sunday 01:00 UTC = 02:00 Copenhagen in winter, 03:00 in summer (SPEC.md §6).
  # Render stops a run after 12 h; the job waits at most 10 h for the grading batch.
  - type: cron
    name: tmk-weekly
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "0 1 * * 0"
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync python cli.py weekly
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: DATABASE_URL
        fromDatabase:
          name: tmk-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: tmk-web
          envVarKey: SECRET_KEY
      - key: BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: NCBI_EMAIL
        sync: false
      - key: POSTMARK_SERVER_TOKEN
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
