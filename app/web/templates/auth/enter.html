{% extends "base.html" %}
{% block title %}Sign in · Tell Me Kort{% endblock %}
{% block content %}
<form id="enter" method="post" action="/auth" class="column confirm">
  <h1>Sign in</h1>
  <input type="hidden" name="t" id="t">
  <p id="status">Tap to finish signing in.</p>
  <div class="actions"><button class="button" type="submit">Sign in</button></div>
</form>
<script>
  // Keep the token out of the address bar and history; submitting stays a human tap.
  const t = decodeURIComponent(location.hash.slice(1));
  history.replaceState(null, "", location.pathname);
  if (t) { document.getElementById("t").value = t; }
  else {
    document.querySelector("#enter button").hidden = true;
    document.getElementById("status").innerHTML = 'This link is incomplete. <a href="/login">Request a new one</a>.';
  }
</script>
{% endblock %}
