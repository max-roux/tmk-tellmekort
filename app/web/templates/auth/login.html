{% extends "base.html" %}
{% block title %}Sign in · Maxfac Papers{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="muted">We'll email you a link that signs you in. No password needed.</p>
<form method="post" action="/login" class="card stack">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required value="{{ email or '' }}">
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <div><button class="button" type="submit">Email me a sign-in link</button></div>
</form>
<p class="muted small"><a href="/privacy">Privacy note</a></p>
{% endblock %}
