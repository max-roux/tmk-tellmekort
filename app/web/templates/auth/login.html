{% extends "base.html" %}
{% block title %}Sign in · Tell Me Kort{% endblock %}
{% block content %}
<div class="column">
  <h1>Sign in</h1>
  <p class="muted">We'll email you a link that signs you in. No password needed.</p>
  <form method="post" action="/login" class="stack form-sheet">
    <label for="email" class="field-label">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required value="{{ email or '' }}">
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <div class="actions"><button class="button primary" type="submit">Email me a sign-in link</button></div>
  </form>
</div>
{% endblock %}
