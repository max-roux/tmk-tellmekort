{% extends "base.html" %}
{% block title %}Confirm · Tell Me Kort{% endblock %}
{% block content %}
<form id="act" method="post" action="/a" class="column confirm">
  <h1>One tap to confirm</h1>
  <input type="hidden" name="t" id="t">
  <p id="status">Tap to confirm.</p>
  <div class="actions"><button class="button" type="submit">{{ button }}</button></div>
</form>
<script>
  // Keep the token out of the address bar and history; submitting stays a human tap.
  const t = decodeURIComponent(location.hash.slice(1));
  history.replaceState(null, "", location.pathname);
  if (t) { document.getElementById("t").value = t; }
  else {
    document.querySelector("#act button").hidden = true;
    document.getElementById("status").innerHTML = 'This link is incomplete. <a href="/">Open your feed</a>.';
  }
</script>
{% endblock %}
