{% extends "base.html" %}
{% block title %}Opening calibration{% endblock %}
{% block content %}
<form id="enter" method="post" action="/admin/calibrate/enter">
  <input type="hidden" name="t" id="t">
  <p class="muted">Opening the calibration page…</p>
  <noscript><p>JavaScript is needed to open this link.</p></noscript>
</form>
<script>
  const t = decodeURIComponent(location.hash.slice(1));
  history.replaceState(null, "", location.pathname);
  if (t) { document.getElementById("t").value = t; document.getElementById("enter").submit(); }
  else { document.querySelector("p").textContent = "This link is incomplete. Ask for a new one."; }
</script>
{% endblock %}
