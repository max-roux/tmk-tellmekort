[project]
name = "maxfac-recommender"
version = "0.1.0"
description = "Weekly LLM-graded research-paper recommendations for a maxillofacial surgeon."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "anthropic>=2.3.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "numpy>=2.5.4",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mutmut>=3.8.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.domain.*"
strict = true

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres with pgvector (DATABASE_URL)"]

[tool.mutmut]
# Mutation-test the pure domain logic and the feed built on it.
source_paths = ["app/domain/", "app/feed/"]
also_copy = ["alembic.ini", "app/", "tools/", "tests/"]
